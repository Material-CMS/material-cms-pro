{%- if apos.workflow.localizations().length > 1 -%}
  <div class="nav-locale">
    <div class="row">
        <ul class='col s12 center'>
          {% for localization in apos.workflow.localizations() %}
            <li>
              <a href="{{ localization._url | build({ workflowLocale: localization.workflowLocale }) }}">{{ localization.label }}</a>
              {% if not loop.last %}<p>|</p>{% endif %}
            </li>
          {% endfor %}
        </ul>
    </div>
  </div>
{%- endif -%}
